@if (isDateToday()) {
    <h2>Today is {{ date() | date }}. You can do it!</h2>
} @else {
    <h2>Your score for {{ date() | date }}</h2>
}

<app-habit-counter [date]="date()" [disabled]="!isDateToday()" />

<section>
    <h3>Get a glimpse of your other days</h3>
    <app-habit-day-view (select)="handleSelect($event)" />
</section>
